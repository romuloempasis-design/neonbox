<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020611">
<title>Neonbox</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#02040b;
  color:#dff8ff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

button{
  font:inherit;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

.console{
  width:min(100vw,430px);
  height:min(100dvh,900px);
  min-height:540px;

  padding:
    max(10px,env(safe-area-inset-top))
    max(9px,env(safe-area-inset-right))
    max(12px,env(safe-area-inset-bottom))
    max(9px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;
  gap:10px;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 20%,
      #102957 0,
      #07142d 35%,
      #020817 75%
    );

  border:2px solid #087fff;
  border-radius:34px;

  box-shadow:
    0 0 12px #008cff,
    0 0 45px #006cff77,
    inset 0 0 35px #008cff20,
    inset 0 2px 0 #57d3ff55;
}

.console:after{
  content:"";
  position:absolute;
  inset:5px;
  pointer-events:none;

  border:1px solid #23aaff35;
  border-radius:29px;
}

.screen{
  flex:1 1 auto;
  min-height:0;

  display:flex;

  border:3px solid #123f6b;
  border-radius:20px;

  padding:6px;

  background:#01050d;

  box-shadow:
    inset 0 0 25px #000,
    0 0 15px #008cff55;
}

#neonbox-screen{
  width:100%;
  height:100%;

  display:block;

  border:2px solid #159dff;
  border-radius:12px;

  background:#01050d;

  box-shadow:
    inset 0 0 20px #008cff22,
    0 0 10px #008cff55;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
}

.controls{
  flex:0 0 clamp(245px,34dvh,310px);

  display:grid;

  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 34px;

  gap:4px;

  padding:12px 8px 5px;

  position:relative;
}

.dpad{
  position:relative;

  width:min(170px,40vw);
  aspect-ratio:1;

  margin:auto;

  filter:drop-shadow(0 0 7px #008cff);
}

.key{
  position:absolute;

  width:30%;
  height:30%;

  padding:0;

  border:2px solid #1ebaff;
  border-radius:0;

  color:#45caff;

  background:
    linear-gradient(
      145deg,
      #0b2c55,
      #06162f
    );

  box-shadow:
    inset 0 0 10px #008cff44,
    0 0 8px #008cff,
    0 0 18px #008cff55;

  font-size:20px;
  font-weight:900;

  touch-action:none;

  outline:none;
}

.up{
  left:35%;
  top:0;

  border-radius:
    9px 9px 3px 3px;
}

.left{
  left:0;
  top:35%;

  border-radius:
    9px 3px 3px 9px;
}

.right{
  right:0;
  top:35%;

  border-radius:
    3px 9px 9px 3px;
}

.down{
  left:35%;
  bottom:0;

  border-radius:
    3px 3px 9px 9px;
}

.center{
  position:absolute;

  left:35%;
  top:35%;

  width:30%;
  height:30%;

  background:#071a34;

  border:2px solid #176ca8;

  border-radius:3px;

  box-shadow:
    inset 0 0 8px #008cff22;
}

.key:active,
.key.pressed{
  transform:scale(.93);

  color:#fff;

  background:#0c3d70;

  box-shadow:
    inset 0 0 12px #00bfff66,
    0 0 12px #00bfff,
    0 0 25px #00bfff77;
}

.action{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:clamp(14px,5vw,25px);

  transform:rotate(-15deg);
}

.round{
  width:clamp(58px,16vw,70px);

  aspect-ratio:1;

  padding:0;

  border-radius:50%;

  color:#fff;

  font-size:21px;
  font-weight:1000;

  touch-action:none;

  outline:none;
}

.a{
  background:
    radial-gradient(
      circle at 35% 25%,
      #ff654f,
      #b81732 65%,
      #650b1c
    );

  border:2px solid #ff4b65;

  box-shadow:
    0 0 10px #ff244c,
    0 0 24px #ff244c77;

  transform:translateY(-8px);
}

.b{
  background:
    radial-gradient(
      circle at 35% 25%,
      #ff55ff,
      #9416b8 65%,
      #4c0863
    );

  border:2px solid #ff48ee;

  box-shadow:
    0 0 10px #ff20df,
    0 0 24px #ff20df77;

  transform:translateY(8px);
}

.round:active,
.round.pressed{
  transform:scale(.92);
}

.a:active,
.a.pressed{
  transform:translateY(-8px) scale(.92);
}

.b:active,
.b.pressed{
  transform:translateY(8px) scale(.92);
}

.menu{
  grid-column:1/-1;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;
}

.menu button{
  min-width:78px;

  padding:6px 12px;

  border-radius:10px;

  border:1px solid #179fff;

  background:#061a35;

  color:#45caff;

  font-size:8px;
  font-weight:900;

  letter-spacing:2px;

  box-shadow:
    0 0 8px #008cff55;

  outline:none;
}

.menu button:active,
.menu button.pressed{
  color:#fff;

  box-shadow:
    0 0 15px #00bfff;

  transform:translateY(2px);
}

.footer{
  position:absolute;

  bottom:5px;
  left:0;
  right:0;

  text-align:center;

  font-size:7px;
  letter-spacing:2px;

  color:#267eb0;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
}

@media(max-height:680px){

  .console{
    gap:6px;
  }

  .controls{
    flex-basis:220px;
  }
}

@media(max-width:350px){

  .console{
    border-radius:22px;
  }

  .screen{
    padding:4px;
    border-radius:15px;
  }

  #neonbox-screen{
    border-radius:10px;
  }

  .controls{
    padding-left:2px;
    padding-right:2px;
  }

  .dpad{
    width:min(155px,40vw);
  }

  .key{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="console">

  <div class="screen">
    <canvas id="neonbox-screen"></canvas>
  </div>

  <div class="controls">

    <div class="dpad">

      <button
        class="key up"
        data-input="UP"
        aria-label="Up">
        ▲
      </button>

      <button
        class="key left"
        data-input="LEFT"
        aria-label="Left">
        ◀
      </button>

      <button
        class="key right"
        data-input="RIGHT"
        aria-label="Right">
        ▶
      </button>

      <button
        class="key down"
        data-input="DOWN"
        aria-label="Down">
        ▼
      </button>

      <span class="center"></span>

    </div>

    <div class="action">

      <button
        class="round b"
        data-input="B"
        aria-label="B">
        B
      </button>

      <button
        class="round a"
        data-input="A"
        aria-label="A">
        A
      </button>

    </div>

    <div class="menu">

      <button
        data-input="SELECT"
        aria-label="Select">
        SELECT
      </button>

      <button
        data-input="START"
        aria-label="Start">
        START
      </button>

    </div>

  </div>

</div>

<script src="neonbox.js"></script>

</body>
</html>
